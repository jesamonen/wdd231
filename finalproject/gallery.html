<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery & Contact - Osuwake Paints & Screeding Solutions</title>
  <meta name="description" content="View our portfolio of 15+ completed wall screeding and painting projects, and submit a request for an on-site estimate.">
  <meta name="author" content="Osuwake Paints">

  <link rel="icon" href="https://picsum.photos/id/1068/32/32" type="image/x-icon">
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/layout.css">
  <script type="module" src="scripts/main.js"></script>
</head>
<body>

  <header>
    <a href="index.html" class="logo">Osuwake Paints</a>
    <button id="hamburger-btn" aria-label="Toggle Navigation">&#9776;</button>
    <nav id="primary-nav">
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="services.html">Services</a></li>
        <li><a href="gallery.html">Gallery/Contact</a></li>
      </ul>
    </nav>
  </header>

  <main style="padding: 1rem;">
    <section>
      <h2>Featured Work Gallery</h2>
      <div style="margin: 1rem 0;">
        <label for="filter-select">Filter Projects: </label>
        <select id="filter-select" style="padding: 0.5rem;">
          <option value="all">All Projects</option>
          <option value="Wall Screeding">Wall Screeding</option>
          <option value="Painting Services">Painting Services</option>
          <option value="Paint Production">Paint Production</option>
        </select>
      </div>
      
      <!-- Dynamic cards rendered here by JavaScript -->
      <div id="gallery-container" class="card-grid"></div>
    </section>

    <!-- Modal Dialog Requirement -->
    <dialog id="detail-modal">
      <div id="modal-content"></div>
      <button id="close-modal-btn" class="btn">Close</button>
    </dialog>

    <!-- Form Requirement (posting to thank-you.html action page) -->
    <section id="contact-form" style="max-width: 600px; margin: 3rem auto; background: white; padding: 1.5rem; border-radius: 8px;">
      <h2>Contact Us / Request Estimate</h2>
      <form action="thank-you.html" method="get">
        <div style="margin-bottom: 1rem;">
          <label for="fullname">Full Name:</label><br>
          <input type="text" id="fullname" name="fullname" required style="width: 100%; padding: 0.5rem;">
        </div>
        <div style="margin-bottom: 1rem;">
          <label for="email">Email Address:</label><br>
          <input type="email" id="email" name="email" required style="width: 100%; padding: 0.5rem;">
        </div>
        <div style="margin-bottom: 1rem;">
          <label for="service">Required Service:</label><br>
          <select id="service" name="service" style="width: 100%; padding: 0.5rem;">
            <option value="Wall Screeding">Wall Screeding</option>
            <option value="Painting Services">Painting Services</option>
            <option value="Paint Production">Paint Production</option>
          </select>
        </div>
        <div style="margin-bottom: 1rem;">
          <label for="message">Message:</label><br>
          <textarea id="message" name="message" rows="4" style="width: 100%; padding: 0.5rem;" required></textarea>
        </div>
        <button type="submit" class="btn">Submit Request</button>
      </form>
    </section>
  </main>

  <footer>
    <p><a href="attributions.html">Attributions</a> | <a href="https://youtube.com" target="_blank">Video Demonstration Link</a></p>
    <p>&copy; 2026 Osuwake Paints & Screeding Solution.</p>
  </footer>

</body>
</html>
